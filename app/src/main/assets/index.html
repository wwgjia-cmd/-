<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>名片集</title>
<script src="xlsx.full.min.js"></script>
<style>
:root{--ink:#0F2C3F;--paper:#EEF3F1;--card:#FFFFFF;--gfp:#1FA36A;--muted:#5D7280;--line:#D3DEDA;--field:#F7FAF9;--warn:#B4441F}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);
  font-family:"MiSans","PingFang SC","Noto Sans SC",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
.serif{font-family:"Noto Serif CJK SC","Source Han Serif SC","Songti SC",serif}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px 120px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:6px 0 14px}
h1{font-weight:900;font-size:32px;margin:0;line-height:1}
.count{color:var(--muted);font-size:14px;margin-top:6px}
.hbtns{display:flex;gap:8px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;font-size:15px;font-weight:600}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.danger{color:var(--warn)}
.btn:disabled{opacity:.5}
.search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:16px;margin-bottom:12px}
.list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.item{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}
.thumb{flex:0 0 72px;height:46px;border-radius:6px;object-fit:cover;background:var(--field)}
.meta{min-width:0;flex:1}
.meta b{display:block;font-size:18px}
.meta span{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{text-align:center;color:var(--muted);padding:48px 16px;line-height:1.7}
.empty svg{width:120px;height:80px;margin-bottom:10px}
.dock{position:fixed;left:0;right:0;bottom:0;padding:12px 16px 16px;background:linear-gradient(to top,var(--paper) 70%,transparent);display:flex;justify-content:center}
.dock .inner{display:grid;grid-template-columns:2fr 1fr;gap:10px;width:100%;max-width:560px}
.shoot{background:var(--gfp);color:#fff;border:0;border-radius:16px;padding:16px;font-size:17px;font-weight:600}
.pick{position:relative;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden}
.vh{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:0}
.sheet{position:fixed;inset:0;background:var(--paper);display:none;overflow:auto;z-index:10}
.sheet.open{display:block}
.bar{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 16px;background:var(--paper);border-bottom:1px solid var(--line)}
.bar h2{font-size:19px;margin:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.body{max-width:560px;margin:0 auto;padding:16px 16px 40px}
.shots{display:flex;gap:8px;overflow-x:auto;margin-bottom:10px}
.shots img{height:150px;border-radius:10px;border:1px solid var(--line);background:var(--field)}
.status{border-radius:12px;padding:12px 14px;margin:10px 0;font-size:14px;line-height:1.6;background:var(--card);border:1px solid var(--line)}
.status.err{border-color:var(--warn);color:var(--warn)}
.status.busy::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--gfp);margin-right:8px;animation:pulse 1s infinite alternate}
@keyframes pulse{to{opacity:.25}}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.f{width:100%;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--field)}
textarea.f{min-height:70px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2>div{min-width:0}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 6px}
.quick a{font-size:14px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:inherit;text-decoration:none}
.note{color:var(--muted);font-size:13px;line-height:1.6;margin:6px 0 0}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.hidden{display:none!important}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:40}
.viewer.open{display:flex}
.viewer img{max-width:100%;max-height:100%}
.mini{position:fixed;inset:0;background:rgba(5,20,30,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
.mini.open{display:flex}
.mini .panel{background:var(--paper);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 16px 24px;display:grid;gap:10px}
.mini h3{margin:0 0 4px;font-size:18px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1 class="serif">名片集</h1><div class="count" id="count">载入中…</div></div>
    <div class="hbtns"><button class="btn" id="setBtn">设置</button><button class="btn" id="exportBtn">导出 Excel</button></div>
  </header>
  <input class="search" id="q" type="search" placeholder="搜索姓名、公司、电话…" aria-label="搜索名片">
  <ul class="list" id="list"></ul>
  <div class="empty hidden" id="empty">
    <svg viewBox="0 0 120 80" aria-hidden="true"><rect x="14" y="14" width="92" height="56" rx="6" fill="none" stroke="currentColor" stroke-width="2"/><rect x="24" y="8" width="92" height="56" rx="6" fill="#fff" stroke="#1FA36A" stroke-width="2"/><line x1="34" y1="24" x2="74" y2="24" stroke="#1FA36A" stroke-width="3"/><line x1="34" y1="34" x2="94" y2="34" stroke="currentColor" stroke-width="1.5"/><line x1="34" y1="42" x2="84" y2="42" stroke="currentColor" stroke-width="1.5"/></svg>
    <div>还没有名片。<br>点下面的“拍名片”，对准名片拍一张，<br>信息会自动识别出来。</div>
  </div>
</div>

<div class="dock"><div class="inner">
  <label class="shoot pick">拍名片<input type="file" id="camIn" accept="image/*" capture="environment" class="vh"></label>
  <label class="btn pick">相册<input type="file" id="albumIn" accept="image/*" multiple class="vh"></label>
</div></div>

<!-- card editor -->
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="bar">
    <button class="btn" id="closeBtn">返回</button>
    <h2 class="serif" id="sheetTitle">新名片</h2>
    <button class="btn primary" id="saveBtn">保存</button>
  </div>
  <div class="body">
    <div class="shots" id="shots"></div>
    <div class="actions" style="margin-top:0">
      <label class="btn pick" id="addBackBtn">加拍背面<input type="file" id="backIn" accept="image/*" capture="environment" class="vh"></label>
      <button class="btn" id="rescanBtn">重新识别</button>
    </div>
    <div class="status hidden" id="status" role="status"></div>
    <div class="quick" id="quick"></div>
    <form id="form" onsubmit="return false">
      <div class="row2"><div><label for="name">姓名</label><input class="f" id="name"></div>
        <div><label for="nameEn">英文名</label><input class="f" id="nameEn"></div></div>
      <label for="company">公司</label><input class="f" id="company">
      <label for="companyEn">公司英文名</label><input class="f" id="companyEn">
      <div class="row2"><div><label for="title">职位</label><input class="f" id="title"></div>
        <div><label for="department">部门</label><input class="f" id="department"></div></div>
      <div class="row2"><div><label for="mobile">手机</label><input class="f" id="mobile" type="tel"></div>
        <div><label for="phone">座机</label><input class="f" id="phone" type="tel"></div></div>
      <div class="row2"><div><label for="email">邮箱</label><input class="f" id="email" type="email"></div>
        <div><label for="wechat">微信</label><input class="f" id="wechat"></div></div>
      <div class="row2"><div><label for="fax">传真</label><input class="f" id="fax" type="tel"></div>
        <div><label for="website">网址</label><input class="f" id="website"></div></div>
      <label for="address">地址</label><input class="f" id="address">
      <label for="notes">备注（在哪认识、聊了什么）</label><textarea class="f" id="notes"></textarea>
    </form>
    <div class="actions"><button class="btn danger hidden" id="delBtn">删除这张名片</button></div>
  </div>
</div>

<!-- settings -->
<div class="sheet" id="settings" role="dialog" aria-modal="true">
  <div class="bar">
    <button class="btn" id="setClose">返回</button>
    <h2 class="serif">识别设置</h2>
    <button class="btn primary" id="setSave">保存</button>
  </div>
  <div class="body">
    <p class="note">不填 API Key 时，用手机自带的离线识别：免费、不联网，但姓名、公司、职位有时会放错位置，需要手动调整。</p>
    <p class="note">填上 Anthropic API Key 后，改用 Claude 识别，准确度高很多，按 API 用量计费。Key 只保存在这台手机上。</p>
    <label for="apiKey">Anthropic API Key</label>
    <input class="f" id="apiKey" type="password" autocomplete="off" placeholder="sk-ant-…">
    <label for="model">模型</label>
    <input class="f" id="model" autocomplete="off">
    <div class="actions"><button class="btn" id="testBtn">测试连接</button></div>
    <div class="status hidden" id="setStatus"></div>
  </div>
</div>

<!-- export choice -->
<div class="mini" id="exportSheet">
  <div class="panel">
    <h3 class="serif" id="exportTitle">导出 Excel</h3>
    <button class="btn primary" id="expSave">保存到手机“下载”文件夹</button>
    <button class="btn" id="expShare">发送到微信、邮件等</button>
    <button class="btn" id="expCancel">取消</button>
  </div>
</div>

<div class="viewer" id="viewer"><img id="viewerImg" alt="名片原图"></div>
<div class="toast" id="toast" role="status"></div>

<script>
const FIELDS=['name','nameEn','company','companyEn','title','department','mobile','phone','email','wechat','fax','website','address','notes'];
const $=id=>document.getElementById(id);
const NATIVE=typeof window.Android!=='undefined';
let cards=[], cur=null, runId=0;

function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2400);}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function status(msg,kind,el='status'){const s=$(el);if(!msg){s.className='status hidden';return;}s.className='status'+(kind?' '+kind:'');s.textContent=msg;}
function newId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function fmtDate(t){const d=new Date(t);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}

/* ---------- settings ---------- */
const SKEY='cc-settings';
const DEFAULT_MODEL='claude-sonnet-5-5';
function getS(){try{return Object.assign({key:'',model:DEFAULT_MODEL},JSON.parse(localStorage.getItem(SKEY)||'{}'));}catch(e){return {key:'',model:DEFAULT_MODEL};}}
function setS(s){try{localStorage.setItem(SKEY,JSON.stringify(s));}catch(e){}}

/* ---------- IndexedDB store ---------- */
const store=(()=>{
  let p;
  const open=()=>p||(p=new Promise((res,rej)=>{const r=indexedDB.open('namecards',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('cards',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}));
  const tx=(mode,fn)=>open().then(db=>new Promise((res,rej)=>{const t=db.transaction('cards',mode);const req=fn(t.objectStore('cards'));
    t.oncomplete=()=>res(req&&req.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);}));
  return {all:()=>tx('readonly',s=>s.getAll()),put:c=>tx('readwrite',s=>s.put(c)),del:id=>tx('readwrite',s=>s.delete(id))};
})();
async function reload(){cards=(await store.all()||[]).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));render();}

/* ---------- list ---------- */
function render(){
  const q=$('q').value.trim().toLowerCase();
  const shown=cards.filter(c=>!q||FIELDS.some(f=>String(c[f]||'').toLowerCase().includes(q)));
  $('count').textContent=`共 ${cards.length} 张`+(q?`，找到 ${shown.length} 张`:'');
  $('empty').classList.toggle('hidden',cards.length>0);
  $('list').innerHTML=shown.map(c=>`<li><button class="item" data-id="${esc(c.id)}">
    ${c.thumb?`<img class="thumb" src="${c.thumb}" alt="">`:'<span class="thumb"></span>'}
    <span class="meta"><b>${esc(c.name||c.nameEn||'未命名')}</b>
    <span>${esc([c.title,c.company||c.companyEn].filter(Boolean).join(' · '))}</span>
    <span>${esc(c.mobile||c.phone||c.email||'')}</span></span></button></li>`).join('');
}
$('list').addEventListener('click',e=>{const b=e.target.closest('.item');if(b)openCard(cards.find(c=>c.id===b.dataset.id));});
$('q').addEventListener('input',render);

/* ---------- images ---------- */
function loadImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('bad'));i.src=u;});}
function draw(img,max,q){const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement('canvas');
  c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',q);}
async function addFiles(files){
  for(const f of files){
    if(cur.shots.length>=2){toast('每张名片最多两张照片（正面和背面）');break;}
    try{const img=await loadImg(f);
      cur.shots.push(draw(img,1000,.75));
      cur.scan.push(draw(img,1800,.9).split(',')[1]);
      cur.thumb=cur.thumb||draw(img,240,.7);
    }catch(e){toast('这张照片打不开，换一张试试');}
  }
  renderShots(); recognize();
}
function renderShots(){
  $('shots').innerHTML=cur.shots.map((u,i)=>`<img src="${u}" alt="名片${i?'背面':'正面'}">`).join('');
  $('addBackBtn').classList.toggle('hidden',cur.shots.length>=2);
  $('rescanBtn').classList.toggle('hidden',!cur.scan.length);
}
$('shots').addEventListener('click',e=>{const i=e.target.closest('img');if(i){$('viewerImg').src=i.src;$('viewer').classList.add('open');}});
$('viewer').onclick=()=>$('viewer').classList.remove('open');

/* ---------- native bridge ---------- */
const pending={};
window.__nativeReply=(id,result,error)=>{const p=pending[id];if(!p)return;delete pending[id];error?p.rej(new Error(error)):p.res(result);};
function nativeOcr(b64){return new Promise((res,rej)=>{const id=newId();pending[id]={res,rej};
  try{Android.ocr(id,b64);}catch(e){delete pending[id];rej(e);}});}

/* ---------- recognition: Claude API ---------- */
const PROMPT=`这些图片是同一张名片（可能包括正面和背面）。请读出名片上的信息，只回复一个 JSON 对象，不要其他文字。
字段（没有就填空字符串 ""，按名片原文填写，不要编造）：
{"name":"中文姓名","nameEn":"英文姓名","company":"公司中文名","companyEn":"公司英文名","title":"职位","department":"部门",
"mobile":"手机号","phone":"座机/办公电话","fax":"传真","email":"邮箱","wechat":"微信号","website":"网址","address":"地址"}
如果只有一种语言，就填对应字段，另一种留空。有多个手机号用 " / " 分隔。地址优先用中文。`;
async function claudeRead(b64s,S){
  const content=[...b64s.map(d=>({type:'image',source:{type:'base64',media_type:'image/jpeg',data:d}})),{type:'text',text:PROMPT}];
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
    headers:{'content-type':'application/json','x-api-key':S.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:S.model||DEFAULT_MODEL,max_tokens:1024,messages:[{role:'user',content}]})});
  if(!r.ok){let msg='';try{msg=(await r.json()).error?.message||'';}catch(e){} const err=new Error(msg);err.status=r.status;throw err;}
  const j=await r.json();
  const text=(j.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('');
  const m=text.match(/\{[\s\S]*\}/); if(!m) throw new Error('nojson');
  return JSON.parse(m[0]);
}

/* ---------- recognition: offline OCR + rules ---------- */
const RX={
  email:/[\w.+-]+@[\w-]+(\.[\w-]+)+/,
  web:/((https?:\/\/)?(www\.)[\w-]+(\.[\w-]+)+[\/\w.-]*)|(https?:\/\/[\w-]+(\.[\w-]+)+[\/\w.-]*)/i,
  mobile:/(\+?86[\s-]?)?1[3-9]\d[\s-]?\d{4}[\s-]?\d{4}/g,
  phoneLabel:/(电话|座机|总机|办公|Tel|TEL|Phone|T[:：]|Office|Direct|Dir)/,
  faxLabel:/(传真|Fax|FAX|F[:：])/,
  mobLabel:/(手机|移动|Mobile|Mob|Cell|M[:：])/,
  wechat:/(微信|WeChat|Wechat|WX)[\s:：]*([A-Za-z][\w-]{4,})/,
  addr:/(地址|Add|Address|地\s*址)|(省|市|区|县|路|街|号|大道|大厦|园区|楼|室)/,
  company:/(公司|集团|有限|股份|大学|学院|医院|研究所|研究院|中心|事务所|银行|基金|资本|Inc\.?|Ltd\.?|LLC|Co\.|Corporation|Corp\.?|Group|University|Hospital|Institute|Biotech|Pharma|Therapeutics|Capital|Partners|Bank)/i,
  title:/(经理|总监|主任|总裁|董事|教授|医生|医师|工程师|主管|主席|院长|所长|科长|处长|部长|总经理|副总|首席|创始人|合伙人|顾问|代表|研究员|秘书|专员|CEO|CTO|CFO|COO|CSO|CMO|VP|Director|Manager|President|Professor|Officer|Founder|Partner|Head|Lead|Engineer|Scientist|Consultant|Chairman|Associate|Analyst|Representative)/i,
  dept:/(部|处|科|室|事业部|Department|Dept\.?|Division)$/i,
  hanName:/^[\u4e00-\u9fa5·]{2,4}$/,
  enName:/^[A-Z][a-zA-Z'-]+( [A-Z][a-zA-Z.'-]*){1,2}$/
};
const strip=(s,re)=>s.replace(re,'').replace(/^[\s:：|/,，]+|[\s:：|/,，]+$/g,'');
function digits(s){const m=s.match(/(\+?\d[\d\s()-]{6,}\d)/);return m?m[1].trim():'';}
function parseLines(lines){
  const out={};FIELDS.forEach(f=>out[f]='');
  const used=new Set();
  const mobiles=[];
  lines.forEach((L,i)=>{
    const t=L.text.trim(); if(!t)return;
    const em=t.match(RX.email); if(em&&!out.email){out.email=em[0];used.add(i);return;}
    const wx=t.match(RX.wechat); if(wx&&!out.wechat){out.wechat=wx[2];used.add(i);return;}
    if(RX.faxLabel.test(t)&&digits(t)){out.fax=out.fax||digits(t);used.add(i);return;}
    const mm=t.match(RX.mobile);
    if(mm&&(RX.mobLabel.test(t)||!RX.phoneLabel.test(t))){mm.forEach(x=>mobiles.push(x.trim()));used.add(i);return;}
    if(RX.phoneLabel.test(t)&&digits(t)){out.phone=out.phone||digits(t);used.add(i);return;}
    const w=t.match(RX.web); if(w&&!out.website&&!RX.email.test(t)){out.website=w[0];used.add(i);return;}
  });
  out.mobile=[...new Set(mobiles)].join(' / ');
  lines.forEach((L,i)=>{
    if(used.has(i))return; const t=L.text.trim();
    if(/(地址|Add)/i.test(t)||(RX.addr.test(t)&&/\d/.test(t)&&t.length>8)){
      const a=strip(t,/^(地址|地\s*址|Add(ress)?)[\s.:：]*/i);
      if(/[\u4e00-\u9fa5]/.test(a)){out.address=out.address||a;}else if(!out.address){out.address=a;}
      used.add(i);}
  });
  lines.forEach((L,i)=>{
    if(used.has(i))return; const t=L.text.trim();
    if(RX.company.test(t)&&t.length>3&&!RX.title.test(t.replace(/(公司|集团|有限)/g,''))){
      if(/[\u4e00-\u9fa5]/.test(t)){if(!out.company){out.company=t;used.add(i);}}
      else if(!out.companyEn){out.companyEn=t;used.add(i);}
    }
  });
  lines.forEach((L,i)=>{
    if(used.has(i))return; const t=L.text.trim();
    if(RX.title.test(t)&&t.length<=40){out.title=out.title?out.title+' / '+t:t;used.add(i);}
    else if(RX.dept.test(t)&&t.length<=20&&!out.department){out.department=t;used.add(i);}
  });
  const cand=lines.map((L,i)=>({...L,i,t:L.text.replace(/\s/g,'')})).filter(L=>!used.has(L.i));
  const han=cand.filter(L=>RX.hanName.test(L.t)).sort((a,b)=>b.h-a.h)[0];
  if(han){out.name=han.t;used.add(han.i);}
  const en=lines.map((L,i)=>({...L,i,t:L.text.trim()})).filter(L=>!used.has(L.i)&&RX.enName.test(L.t)&&!RX.title.test(L.t)&&!RX.company.test(L.t)).sort((a,b)=>b.h-a.h)[0];
  if(en){out.nameEn=en.t;used.add(en.i);}
  if(!out.name&&!out.nameEn){const big=cand.filter(L=>!used.has(L.i)&&L.t.length<=12).sort((a,b)=>b.h-a.h)[0];if(big){out.name=big.t;used.add(big.i);}}
  const rest=lines.filter((L,i)=>!used.has(i)).map(L=>L.text.trim()).filter(Boolean);
  return {out,rest};
}
async function offlineRead(b64s){
  let all=[];
  for(const b of b64s){const r=await nativeOcr(b);all=all.concat(JSON.parse(r||'[]'));}
  return parseLines(all);
}

/* ---------- recognize ---------- */
async function recognize(){
  if(!cur||!cur.scan.length)return;
  const my=++runId, S=getS();
  $('rescanBtn').disabled=true;
  try{
    let res, extra=[];
    if(S.key){
      status('正在用 Claude 识别，通常需要几秒到十几秒…','busy');
      try{res=await claudeRead(cur.scan,S);}
      catch(e){
        if(!NATIVE)throw e;
        const why=e.status===401?'API Key 不对':e.status===429?'API 请求太频繁':e.status?`API 返回错误 ${e.status}`:'网络连不上 Claude';
        status(`${why}，改用离线识别…`,'busy');
        const o=await offlineRead(cur.scan);res=o.out;extra=o.rest;
      }
    }else{
      if(!NATIVE){status('请在安卓 App 里使用，或在“设置”里填 API Key。','err');return;}
      status('正在离线识别…','busy');
      const o=await offlineRead(cur.scan);res=o.out;extra=o.rest;
    }
    if(my!==runId||!cur)return;
    let filled=0;
    for(const f of FIELDS){if(f==='notes')continue;const v=typeof res?.[f]==='string'?res[f].trim():'';
      if(v&&!$(f).value.trim()){$(f).value=v;filled++;}}
    if(extra.length&&!$('notes').value.trim()) $('notes').value='名片上其他文字：'+extra.join('；');
    status(filled?'识别完成。请核对一下，有错直接改，然后点“保存”。'+(extra.length?' 没归类的文字放进了备注。':'')
      :'没认出文字。照片可能太暗、反光或太斜，可以重拍或手动填写。',filled?'':'err');
    quickLinks();
  }catch(e){
    if(my!==runId)return;
    status('识别失败：'+(e.status===401?'API Key 不对，请到“设置”里检查。':e.message||'未知错误')+' 可以点“重新识别”或手动填写。','err');
  }finally{$('rescanBtn').disabled=false;}
}
$('rescanBtn').onclick=()=>{FIELDS.forEach(f=>{if(f!=='notes')$(f).value='';});recognize();};

function quickLinks(){
  const out=[];
  if(cur&&cur.saved){
    const m=$('mobile').value.split('/')[0].trim(),p=$('phone').value.trim(),e=$('email').value.trim();
    if(m)out.push(`<a href="tel:${esc(m.replace(/[^\d+]/g,''))}">打手机</a>`);
    if(p)out.push(`<a href="tel:${esc(p.replace(/[^\d+,]/g,''))}">打座机</a>`);
    if(e)out.push(`<a href="mailto:${esc(e)}">发邮件</a>`);
  }
  $('quick').innerHTML=out.join('');
}

/* ---------- open / save / delete ---------- */
function openSheet(c,isNew){
  cur=c; runId++;
  $('sheetTitle').textContent=isNew?'新名片':(c.name||c.nameEn||'名片');
  FIELDS.forEach(f=>$(f).value=c[f]||''); status('');
  $('delBtn').classList.toggle('hidden',isNew); renderShots(); quickLinks();
  $('sheet').classList.add('open'); $('sheet').scrollTop=0;
}
function openCard(c){openSheet({...c,shots:[...(c.shots||[])],scan:[],saved:true},false);}
function startNew(files){openSheet({id:newId(),shots:[],scan:[],thumb:'',createdAt:Date.now(),saved:false},true);addFiles(files);}
function closeSheet(){runId++;$('sheet').classList.remove('open');cur=null;}
function tryClose(){
  const dirty=cur&&!cur.saved&&(cur.shots.length||FIELDS.some(f=>$(f).value.trim()));
  if(dirty&&!confirm('这张名片还没保存，确定放弃吗？'))return; closeSheet();}
$('closeBtn').onclick=tryClose;
$('saveBtn').onclick=async()=>{
  if(!cur)return;
  const rec={id:cur.id,createdAt:cur.createdAt||Date.now(),updatedAt:Date.now(),thumb:cur.thumb||'',shots:cur.shots};
  FIELDS.forEach(f=>rec[f]=$(f).value.trim());
  if(!FIELDS.some(f=>rec[f])&&!rec.shots.length){toast('先拍一张或填点信息再保存');return;}
  $('saveBtn').disabled=true;
  try{await store.put(rec);await reload();toast('已保存');closeSheet();}
  catch(e){toast('保存失败：手机存储空间可能不够');}
  finally{$('saveBtn').disabled=false;}
};
$('delBtn').onclick=async()=>{
  if(!cur||!confirm(`删除 ${cur.name||cur.nameEn||'这张名片'}？`))return;
  try{await store.del(cur.id);await reload();toast('已删除');closeSheet();}catch(e){toast('删除失败');}
};

/* ---------- pickers ---------- */
function onNew(e){const files=[...e.target.files];e.target.value='';if(files.length)startNew(files);}
$('camIn').onchange=onNew;$('albumIn').onchange=onNew;
$('backIn').onchange=e=>{const files=[...e.target.files];e.target.value='';if(files.length&&cur)addFiles(files);};

/* ---------- settings ---------- */
$('setBtn').onclick=()=>{const S=getS();$('apiKey').value=S.key;$('model').value=S.model||DEFAULT_MODEL;status('',null,'setStatus');$('settings').classList.add('open');};
$('setClose').onclick=()=>$('settings').classList.remove('open');
$('setSave').onclick=()=>{setS({key:$('apiKey').value.trim(),model:$('model').value.trim()||DEFAULT_MODEL});$('settings').classList.remove('open');
  toast($('apiKey').value.trim()?'已保存，之后用 Claude 识别':'已保存，之后用离线识别');};
$('testBtn').onclick=async()=>{
  const S={key:$('apiKey').value.trim(),model:$('model').value.trim()||DEFAULT_MODEL};
  if(!S.key){status('先填 API Key。','err','setStatus');return;}
  status('正在连接…','busy','setStatus');
  try{const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':S.key,
      'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:S.model,max_tokens:16,messages:[{role:'user',content:'回复"好"'}]})});
    if(r.ok)status('连接成功，可以用 Claude 识别。','', 'setStatus');
    else{let m='';try{m=(await r.json()).error?.message||'';}catch(e){}
      status(r.status===401?'API Key 不对。':r.status===404?'模型名称不对：'+m:`连接失败（${r.status}）：${m}`,'err','setStatus');}
  }catch(e){status('连不上 api.anthropic.com，请检查网络。','err','setStatus');}
};

/* ---------- Excel export ---------- */
const HEAD={name:'姓名',nameEn:'英文名',company:'公司',companyEn:'公司英文名',title:'职位',department:'部门',mobile:'手机',phone:'座机',
  email:'邮箱',wechat:'微信',fax:'传真',website:'网址',address:'地址',notes:'备注'};
function buildXlsx(){
  const rows=cards.map(c=>{const r={};Object.keys(HEAD).forEach(k=>r[HEAD[k]]=c[k]||'');r['收录日期']=fmtDate(c.createdAt);return r;});
  const ws=XLSX.utils.json_to_sheet(rows);
  ws['!cols']=[...Object.keys(HEAD),'d'].map(k=>({wch:{company:28,companyEn:28,address:36,notes:30,email:26}[k]||14}));
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'名片');
  return {name:`名片集_${fmtDate(Date.now())}.xlsx`,b64:XLSX.write(wb,{bookType:'xlsx',type:'base64'})};
}
$('exportBtn').onclick=()=>{
  if(!cards.length){toast('还没有名片可以导出');return;}
  $('exportTitle').textContent=`导出 Excel（${cards.length} 张名片）`;$('exportSheet').classList.add('open');};
$('expCancel').onclick=()=>$('exportSheet').classList.remove('open');
$('exportSheet').addEventListener('click',e=>{if(e.target.id==='exportSheet')$('exportSheet').classList.remove('open');});
$('expSave').onclick=()=>{$('exportSheet').classList.remove('open');
  const f=buildXlsx();
  if(NATIVE){const p=Android.saveFile(f.name,f.b64);p?alert('已保存到：'+p):toast('保存失败');}
  else{const a=document.createElement('a');a.href='data:application/octet-stream;base64,'+f.b64;a.download=f.name;a.click();}};
$('expShare').onclick=()=>{$('exportSheet').classList.remove('open');
  if(!NATIVE){toast('请在安卓 App 里使用分享');return;}
  const f=buildXlsx();if(!Android.shareFile(f.name,f.b64))toast('分享失败');};

/* ---------- back button ---------- */
window.__onBack=()=>{
  if($('viewer').classList.contains('open')){$('viewer').classList.remove('open');return true;}
  if($('exportSheet').classList.contains('open')){$('exportSheet').classList.remove('open');return true;}
  if($('settings').classList.contains('open')){$('settings').classList.remove('open');return true;}
  if($('sheet').classList.contains('open')){tryClose();return true;}
  return false;
};

reload().catch(()=>{$('count').textContent='无法读取本机存储';});
</script>
